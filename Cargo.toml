[package]
name = "gyozarec"
version = "0.5.1"
authors = ["Martin DaVinci"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Screen capture to PNG, GIF and MP4, entirely local"
repository = "https://github.com/martindavinci/GyozaRec"

[workspace]
members = [".", "xtask", "tools/make-ico"]

[package.metadata.packager]
product-name = "GyozaRec"
identifier = "com.martindavinci.gyozarec"
publisher = "Martin DaVinci"
out-dir = "dist"
binaries = [{ path = "gyozarec", main = true }]
icons = ["res/GyozaRec.ico"]
license-file = "packaging/wix/License.rtf"

[package.metadata.packager.wix]
template = "packaging/wix/main.wxs"

[features]
default = ["github-updates"]
# The once-a-day check for a newer release on GitHub (off for store builds).
github-updates = []

[dependencies]
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.12"
ab_glyph = "0.2"
muda = "0.21"
tray-icon = "0.26"
global-hotkey = "0.9"
rfd = "0.17"
interprocess = "2"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gif = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "7"
# QR codes and barcodes in the editor; decoding only, no image codecs.
rxing = { version = "0.9", default-features = false, features = ["decoders", "multi_barcode_readers", "full_barcode_format_support", "encoding_rs"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
] }

[dev-dependencies]
tempfile = "3"
rxing = { version = "0.9", default-features = false, features = ["encoders"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.rxing]
opt-level = "s"
