[package]
name = "gyozarec"
version = "0.1.0"
authors = ["Martin DaVinci"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Screen capture to PNG, GIF and MP4, entirely local"
repository = "https://github.com/martindavinci/GyozaRec"

[workspace]
members = [".", "xtask", "tools/make-ico"]

[package.metadata.packager]
product-name = "GyozaRec"
identifier = "com.martindavinci.gyozarec"
publisher = "Martin DaVinci"
out-dir = "dist"
binaries = [{ path = "gyozarec", main = true }]
icons = ["res/GyozaRec.ico"]
license-file = "packaging/wix/License.rtf"

[package.metadata.packager.wix]
template = "packaging/wix/main.wxs"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.12"
ab_glyph = "0.2"
muda = "0.21"
rfd = "0.17"
interprocess = "2"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
gif = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "7"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
